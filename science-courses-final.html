<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#2563eb;--pr2:#1d4ed8;--pr-l:#eff6ff;--pr-ll:#f8faff;
  --ac:#059669;--ac-l:#ecfdf5;
  --or:#d97706;--or-l:#fffbeb;
  --re:#dc2626;--re-l:#fef2f2;
  --pu:#7c3aed;--pu-l:#f5f3ff;
  --cy:#0891b2;--cy-l:#ecfeff;
  --bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --sw:248px;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#0ea5e9 100%);
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 4px 12px rgba(0,0,0,.08);
  --sh3:0 10px 30px rgba(0,0,0,.1);
  --r:10px;--r2:14px;
}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}

/* LOADING */
#pg-loading{position:fixed;inset:0;background:var(--grad);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff}
#pg-loading .spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
#pg-loading p{font-size:14px;font-weight:600;opacity:.85}

/* AUTH */
#pg-auth{display:none;min-height:100vh;align-items:center;justify-content:center;background:var(--grad);padding:1rem;position:relative;overflow:hidden}
#pg-auth::before{content:'⚗️';position:absolute;font-size:280px;opacity:.04;top:-60px;left:-70px;line-height:1}
.auth-card{background:#fff;border-radius:20px;padding:2.25rem;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.28);position:relative;z-index:1;animation:slideUp .45s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{text-align:center;margin-bottom:1.75rem}
.auth-logo-wrap{display:inline-flex;align-items:center;gap:.65rem;margin-bottom:.6rem}
.auth-logo-ic{width:48px;height:48px;background:var(--grad);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(37,99,235,.35)}
.auth-logo-name{font-size:20px;font-weight:900;color:var(--pr)}
.auth-logo-sub{font-size:11px;color:var(--tx3)}
.auth-badge{display:inline-block;background:var(--pr-l);color:var(--pr);font-size:11.5px;font-weight:600;padding:.35rem .9rem;border-radius:20px}
.tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;margin-bottom:1.5rem;gap:3px}
.tab{flex:1;padding:.5rem;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--tx2);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s}
.tab.on{background:#fff;color:var(--pr);box-shadow:var(--sh)}
.fg{margin-bottom:.9rem}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.06em}
.fi{width:100%;padding:.65rem .9rem;border:1.5px solid var(--bd2);border-radius:var(--r);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--tx);background:#fafbfc;transition:.2s}
.fi:focus{outline:none;border-color:var(--pr);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fi-ta{resize:vertical;min-height:80px}
.bauth{width:100%;padding:.75rem;border:none;border-radius:var(--r);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;transition:.2s}
.bauth:hover{opacity:.92;transform:translateY(-1px)}
.bauth:disabled{opacity:.6;cursor:not-allowed;transform:none}
.afoot{text-align:center;font-size:12px;color:var(--tx2);margin-top:.65rem}
.afoot span{color:var(--pr);cursor:pointer;font-weight:700}
.auth-err{background:var(--re-l);border:1px solid #fca5a5;border-radius:8px;padding:.6rem .9rem;font-size:12.5px;color:var(--re);font-weight:600;margin-bottom:.85rem;display:none}
.auth-err.show{display:block}

/* MAIN */
#pg-main{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:#fff;border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;z-index:200;display:flex;flex-direction:column;transition:.3s}
.slogo{padding:.85rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:.65rem;flex-shrink:0;background:var(--pr-ll)}
.slogo-ic{width:34px;height:34px;background:var(--grad);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.slogo-name{font-size:13px;font-weight:900;color:var(--pr)}
.slogo-sub{font-size:9.5px;color:var(--tx3)}
.snav{flex:1;padding:.5rem;overflow-y:auto}
.nlbl{font-size:9px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.12em;padding:.4rem .75rem;margin-top:.4rem}
.ni{display:flex;align-items:center;gap:.6rem;padding:.56rem .78rem;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:13px;font-weight:500;transition:.15s;margin-bottom:2px;user-select:none}
.ni:hover{background:#f1f5f9;color:var(--tx)}
.ni.on{background:var(--pr-l);color:var(--pr);font-weight:700}
.ni-ic{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--re);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;min-width:18px;text-align:center}
.suser{padding:.75rem 1rem;border-top:1px solid var(--bd);flex-shrink:0}
.suc{display:flex;align-items:center;gap:.6rem}
.sav{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.suf{flex:1;min-width:0}
.sun{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sur{font-size:10px;color:var(--tx3)}
.lout{width:26px;height:26px;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--tx3);font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
.lout:hover{background:var(--re-l);color:var(--re)}

/* CONTENT */
.content{margin-left:var(--sw);flex:1;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--bd);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbt{font-size:15px;font-weight:800;letter-spacing:-.3px}
.tba{display:flex;gap:.45rem;align-items:center}
.ib{width:33px;height:33px;border:none;background:#f1f5f9;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.ib:hover{background:var(--pr-l)}
.ndot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:#ef4444;border-radius:50%;border:2px solid #fff;display:none}
.cb{padding:1.25rem}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem .95rem;border-radius:var(--r);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:.2s}
.btn-pr{background:var(--pr);color:#fff}.btn-pr:hover{background:var(--pr2)}
.btn-se{background:#f1f5f9;color:var(--tx2);border:1px solid var(--bd)}.btn-se:hover{background:var(--bd)}
.btn-gn{background:var(--ac);color:#fff}
.btn-re{background:var(--re);color:#fff}
.btn-or{background:var(--or);color:#fff}
.btn-pu{background:var(--pu);color:#fff}
.btn-cy{background:var(--cy);color:#fff}
.btn-sm{padding:.28rem .65rem;font-size:11.5px}
.btn-lg{padding:.68rem 1.5rem;font-size:14px}
.btn-block{width:100%;justify-content:center}

/* UPLOAD */
.upzone{border:2px dashed var(--bd2);border-radius:var(--r);padding:1.25rem;text-align:center;cursor:pointer;transition:.2s;background:#fafbfc}
.upzone:hover{border-color:var(--pr);background:var(--pr-l)}
.upzone-ic{font-size:24px;margin-bottom:.4rem}
.upzone p{font-size:12.5px;color:var(--tx2)}
.upzone small{font-size:11px;color:var(--tx3)}
.img-preview{width:100%;height:120px;border-radius:var(--r);object-fit:cover;display:block;margin-top:.5rem;border:1px solid var(--bd)}
.pdf-preview{background:var(--re-l);border:1px solid #fca5a5;border-radius:8px;padding:.6rem .9rem;display:flex;align-items:center;gap:.5rem;font-size:12.5px;color:var(--re);font-weight:600;margin-top:.5rem}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:.85rem;margin-bottom:1.2rem}
.scard{background:var(--card);border-radius:var(--r2);padding:1rem;border:1px solid var(--bd);box-shadow:var(--sh);transition:.2s}
.scard:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.si{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:.75rem}
.si-bl{background:#dbeafe}.si-gr{background:#d1fae5}.si-am{background:#fef3c7}.si-pu{background:#ede9fe}.si-cy{background:#cffafe}.si-re{background:#fee2e2}
.sv{font-size:22px;font-weight:900;color:var(--tx);letter-spacing:-1px}
.sl{font-size:11.5px;color:var(--tx2);margin-top:1px;font-weight:500}

/* GRADE TABS */
.grade-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem}
.gtab{padding:.38rem .85rem;border-radius:999px;border:1.5px solid var(--bd2);background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;color:var(--tx2);transition:.2s}
.gtab:hover{border-color:var(--pr);color:var(--pr)}
.gtab.on{background:var(--pr);color:#fff;border-color:var(--pr)}

/* COURSE CARDS */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.cc{background:var(--card);border-radius:var(--r2);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden;transition:.25s;cursor:pointer}
.cc:hover{box-shadow:var(--sh3);transform:translateY(-2px)}
.cth{height:118px;position:relative;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.cth img{width:100%;height:100%;object-fit:cover}
.cth-em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px}
.ctag-gr{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--pr);font-size:10px;padding:2px 7px;border-radius:5px;font-weight:800}
.ctag-enrolled{position:absolute;top:8px;right:8px;background:rgba(5,150,105,.9);color:#fff;font-size:9.5px;padding:2px 7px;border-radius:5px;font-weight:700}
.cbody{padding:.85rem}
.cc-grade{font-size:10px;color:var(--pr);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
.cc-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:.4rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-meta{display:flex;flex-wrap:wrap;gap:.4rem;font-size:11px;color:var(--tx3);margin-bottom:.55rem}
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:700}
.pill-gn{background:var(--ac-l);color:var(--ac)}
.pill-or{background:var(--or-l);color:var(--or)}
.pill-bl{background:var(--pr-l);color:var(--pr)}
.pill-gy{background:#f1f5f9;color:#475569}
.pill-re{background:var(--re-l);color:var(--re)}

/* SESSION LIST */
.sl-wrap{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.sl-hd{padding:.75rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:#f8fafc}
.sl-hd h3{font-size:13px;font-weight:700}
.sl-item{border-bottom:1px solid var(--bd);transition:.15s}
.sl-item:last-child{border-bottom:none}
.sl-item-hd{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;cursor:pointer}
.sl-item-hd:hover{background:#f8fafc}
.sl-item.active-s .sl-item-hd{background:var(--pr-l);border-left:3px solid var(--pr)}
.sl-thumb{width:52px;height:36px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:16px}
.sl-thumb img{width:100%;height:100%;object-fit:cover}
.snum{width:24px;height:24px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--tx2);flex-shrink:0}
.sl-item.active-s .snum{background:var(--pr);color:#fff}
.sinfo{flex:1;min-width:0}
.sname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdur{font-size:10.5px;color:var(--tx3);margin-top:1px}
.s-actions{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.s-buy{padding:.24rem .6rem;border:none;border-radius:5px;font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:700;cursor:pointer;background:var(--pr);color:#fff;transition:.15s}
.s-buy:hover{background:var(--pr2)}
.sl-videos{padding:0 .9rem .6rem 2.5rem;display:none}
.sl-item.active-s .sl-videos{display:block}
.sv-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .65rem;border-radius:8px;cursor:pointer;transition:.15s;margin-bottom:.25rem;border:1px solid var(--bd)}
.sv-item:hover{background:var(--pr-l)}
.sv-item.active-v{background:var(--pr-l);border-color:var(--pr)}
.sv-num{width:22px;height:22px;border-radius:50%;background:var(--pr-l);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--pr);flex-shrink:0}
.sv-item.active-v .sv-num{background:var(--pr);color:#fff}
.sv-info{flex:1;min-width:0}
.sv-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-dur{font-size:10.5px;color:var(--tx3)}

/* VIDEO */
.vwrap{position:relative;border-radius:var(--r2);overflow:hidden;background:#000;margin-bottom:1rem;user-select:none}
.vwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none}
.vshield{position:absolute;inset:0;z-index:10;background:transparent;cursor:default}
.vshield.locked{background:rgba(15,23,42,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:.65rem;text-align:center;padding:1.5rem}
.vlock-icon{font-size:36px}
.vlock-txt{font-size:14px;font-weight:800}
.vlock-sub{font-size:12px;opacity:.72;max-width:220px;line-height:1.5}
.vtabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.65rem}
.vtab{padding:.32rem .75rem;border-radius:999px;border:1.5px solid var(--bd2);background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--tx2);transition:.2s}
.vtab:hover{border-color:var(--pr);color:var(--pr)}
.vtab.on{background:var(--pr);color:#fff;border-color:var(--pr)}

/* TABLE */
.tc{background:var(--card);border-radius:var(--r2);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden;margin-bottom:1rem}
.tch{padding:.8rem 1.1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;background:#fafafa}
.tch h3{font-size:13.5px;font-weight:700}
table{width:100%;border-collapse:collapse}
thead tr{background:#f8fafc}
th{padding:.58rem .9rem;text-align:left;font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:.62rem .9rem;font-size:12.5px;color:var(--tx);border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafafa}
.tdu{display:flex;align-items:center;gap:.5rem}
.tdav{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}

/* BADGE */
.bd-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:700;white-space:nowrap}
.bd-bl{background:#dbeafe;color:#1e40af}
.bd-gr{background:#d1fae5;color:#065f46}
.bd-re{background:#fee2e2;color:#991b1b}
.bd-am{background:#fef3c7;color:#92400e}
.bd-gy{background:#f1f5f9;color:#475569}
.bd-pu{background:#ede9fe;color:#5b21b6}
.bd-cy{background:var(--cy-l);color:var(--cy)}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem;opacity:0;pointer-events:none;transition:.2s}
.mov.show{opacity:1;pointer-events:all}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 28px 70px rgba(0,0,0,.22);transform:scale(.95);transition:.25s}
.mov.show .mbox{transform:scale(1)}
.mbox-lg{max-width:680px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:1}
.mhd h3{font-size:15px;font-weight:800}
.mclose{width:30px;height:30px;border:none;background:#f1f5f9;cursor:pointer;border-radius:7px;font-size:15px;color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:.15s}
.mclose:hover{background:var(--re-l);color:var(--re)}
.mbody{padding:1.4rem}
.mfoot{padding:.9rem 1.4rem;border-top:1px solid var(--bd);display:flex;gap:.4rem;justify-content:flex-end}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}

/* VIDEO ENTRY */
.video-entry{background:#f8fafc;border:1px solid var(--bd);border-radius:var(--r);padding:.85rem;margin-bottom:.6rem;position:relative}
.video-entry-num{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;margin-bottom:.5rem}
.del-video-btn{position:absolute;top:.5rem;right:.5rem;background:var(--re-l);border:none;border-radius:6px;color:var(--re);font-size:13px;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center}

/* HOMEWORK */
.hw-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem;box-shadow:var(--sh)}
.hw-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.65rem;flex-wrap:wrap;gap:.5rem}
.hw-title{font-size:13.5px;font-weight:700}
.hw-meta{font-size:11.5px;color:var(--tx2);margin-top:2px}
.grade-input{width:60px;padding:.35rem .5rem;border:1.5px solid var(--bd2);border-radius:7px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;text-align:center;color:var(--pr)}
.grade-input:focus{outline:none;border-color:var(--pr)}

/* EXAM */
.exam-q{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:1.1rem;margin-bottom:.85rem;box-shadow:var(--sh)}
.exam-q-num{font-size:10.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}
.exam-q-text{font-size:13.5px;font-weight:700;margin-bottom:.75rem;line-height:1.5}
.mcq-opt{display:flex;align-items:center;gap:.65rem;padding:.55rem .75rem;border:1.5px solid var(--bd2);border-radius:8px;margin-bottom:.4rem;cursor:pointer;transition:.15s;font-size:13px}
.mcq-opt:hover{border-color:var(--pr);background:var(--pr-l)}
.mcq-opt.selected{border-color:var(--pr);background:var(--pr-l)}
.mcq-opt.correct{border-color:var(--ac);background:var(--ac-l)}
.mcq-opt.wrong{border-color:var(--re);background:var(--re-l)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, push, update, remove, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ================================================================
// FIREBASE CONFIG
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBisZPbFRZAnFVjeKrNgTmUZqQOBpi0SGE",
  authDomain: "science-courses.firebaseapp.com",
  databaseURL: "https://science-courses-default-rtdb.firebaseio.com",
  projectId: "science-courses",
  storageBucket: "science-courses.firebasestorage.app",
  messagingSenderId: "346136422549",
  appId: "1:346136422549:web:296312f15952ca374c539c",
  measurementId: "G-1H27LSQK3C"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// ================================================================
// GRADE CONFIG (static — admin can manage from DB later)
// ================================================================
var GRADES = [
  {id:"g1",name:"Grade 4"},{id:"g2",name:"Grade 5"},
  {id:"g3",name:"Grade 6"},{id:"g4",name:"Prep 1"},
  {id:"g5",name:"Prep 2"},{id:"g6",name:"Prep 3"},
];
var GRADE_BG = {
  g1:"linear-gradient(135deg,#1e3a8a,#2563eb)",
  g2:"linear-gradient(135deg,#14532d,#16a34a)",
  g3:"linear-gradient(135deg,#4c1d95,#7c3aed)",
  g4:"linear-gradient(135deg,#7c2d12,#ea580c)",
  g5:"linear-gradient(135deg,#164e63,#0891b2)",
  g6:"linear-gradient(135deg,#3b0764,#9333ea)",
};
var GRADE_EM = {g1:"🔬",g2:"⚗️",g3:"🧬",g4:"🧪",g5:"🔭",g6:"⚡"};

function gradeById(id){return GRADES.find(g=>g.id===id);}
function gradeName(id){var g=gradeById(id);return g?g.name:id;}
function gradeColor(id){return GRADE_BG[id]||"linear-gradient(135deg,#1e3a8a,#2563eb)";}
function gradeEm(id){return GRADE_EM[id]||"🔬";}

// CFG — platform settings (stored in DB under /config)
var CFG = {
  name:"Science Courses", sub:"Online Learning",
  logo:"",
  logoEmoji:"⚗️",
  primaryColor:"#2563eb",
  vfNum:"010 XXXX XXXX",
  heroTitle:"Learn Science, One Session at a Time",
  heroDesc:"Enroll in any course for free. Pay only for the sessions you need.",
  showFeatures:true, showLatest:true,
};

function applyLogo(){
  var authIc=document.querySelector(".auth-logo-ic");
  if(authIc)authIc.innerHTML=CFG.logo?`<img src="${CFG.logo}" style="width:100%;height:100%;object-fit:cover">`:`<span>${CFG.logoEmoji||"⚗️"}</span>`;
  var slogoIc=document.querySelector(".slogo-ic");
  if(slogoIc)slogoIc.innerHTML=CFG.logo?`<img src="${CFG.logo}" style="width:100%;height:100%;object-fit:cover">`:`<span>${CFG.logoEmoji||"⚗️"}</span>`;
}

// ================================================================
// IN-MEMORY DATA (loaded from Firebase)
// ================================================================
var COURSES=[], SESSIONS=[], EXAMS=[], USERS=[];
var HW_SUBMISSIONS=[], EXAM_SUBMISSIONS=[], REQUESTS=[], NOTIFS=[];

// ================================================================
// APP STATE
// ================================================================
var CU = null; // current user object
var S = {
  tab:"login", page:"landing",
  activeCourse:null, activeSession:0, activeVideo:0,
  enrolledCourses:{}, unlockedSessions:{}, pendingSessions:{},
  gradeFilter:"all", activeExamId:null, examAnswers:{},
};

// ================================================================
// HELPER: db path shortcuts
// ================================================================
function dbRef(path){return ref(db,path);}
function dbSet(path,val){return set(dbRef(path),val);}
function dbUpdate(path,val){return update(dbRef(path),val);}
function dbPush(path,val){return push(dbRef(path),val);}
function dbGet(path){return get(dbRef(path));}
function dbRemove(path){return remove(dbRef(path));}

// ================================================================
// TOAST
// ================================================================
function toast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.style.background=type==="success"?"#059669":type==="error"?"#dc2626":type==="warn"?"#d97706":"#0f172a";
  t.classList.add("show");clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("show"),3000);
}
window.toast=toast;

// ================================================================
// LOAD ALL DATA FROM FIREBASE
// ================================================================
async function loadAllData(){
  try {
    // نلود كل path لوحده عشان نعرف أنهي واحد بيعمل مشكلة
    console.log("⏳ Loading data, uid:", auth.currentUser?.uid);

    const paths = ["courses","sessions","exams","users","hw_submissions","exam_submissions","requests","notifs","config","grades"];
    const snaps = {};
    for(const p of paths){
      try{
        snaps[p] = await dbGet(p);
        console.log("✅ loaded:", p, snaps[p].exists() ? "has data" : "empty");
      } catch(e){
        console.error("❌ FAILED path:", p, e.message);
        snaps[p] = {exists:()=>false, val:()=>null};
      }
    }

    const [coursesSnap,sessionsSnap,examsSnap,usersSnap,hwSnap,examSubSnap,reqSnap,notifSnap,cfgSnap,gradesSnap] = [
      snaps["courses"],snaps["sessions"],snaps["exams"],snaps["users"],
      snaps["hw_submissions"],snaps["exam_submissions"],snaps["requests"],
      snaps["notifs"],snaps["config"],snaps["grades"]
    ];

    COURSES  = snapToArray(coursesSnap);
    SESSIONS = snapToArray(sessionsSnap);
    EXAMS    = snapToArray(examsSnap);
    USERS    = snapToArray(usersSnap);
    HW_SUBMISSIONS   = snapToArray(hwSnap);
    EXAM_SUBMISSIONS = snapToArray(examSubSnap);
    REQUESTS = snapToArray(reqSnap);
    NOTIFS   = snapToArray(notifSnap);

    console.log("✅ Firebase loaded:",{
      courses: COURSES.length,
      sessions: SESSIONS.length,
      exams: EXAMS.length,
      users: USERS.length,
      requests: REQUESTS.length,
    });
    if(SESSIONS.length>0) console.log("📦 Sample session:", JSON.stringify(SESSIONS[0]));

    // Load custom grades from DB and merge with defaults
    if(gradesSnap.exists()){
      const dbGrades = gradesSnap.val();
      Object.entries(dbGrades).forEach(([k,g])=>{
        if(!GRADES.find(x=>x.id===g.id)){
          GRADES.push({id:g.id, name:g.name});
        } else {
          var existing = GRADES.find(x=>x.id===g.id);
          if(existing) existing.name = g.name;
        }
        if(g.em)  GRADE_EM[g.id] = g.em;
        if(g.col) GRADE_BG[g.id] = `linear-gradient(135deg,${g.col},${g.col})`;
      });
    }

    if(cfgSnap.exists()){
      Object.assign(CFG, cfgSnap.val());
      document.documentElement.style.setProperty("--pr", CFG.primaryColor);
      applyLogo();
    }

    // Load user-specific state
    if(CU){
      const stateSnap = await dbGet("user_state/"+CU.uid);
      if(stateSnap.exists()){
        const st = stateSnap.val();
        S.enrolledCourses  = st.enrolledCourses  || {};
        S.unlockedSessions = st.unlockedSessions || {};
        S.pendingSessions  = st.pendingSessions  || {};
      }
    }
  } catch(e){
    console.error("❌ loadAllData error:", e.message, e);
    toast("Error loading data: "+e.message,"error");
  }
}

// fixArr: يحول أي قيمة جاية من Firebase لـ array صح
// Firebase بيخزن arrays كـ objects {0:{...},1:{...}} فلازم نحولها
function fixArr(val){
  if(!val) return [];
  if(Array.isArray(val)) return val.filter(x=>x!=null);
  if(typeof val === "object") return Object.values(val).filter(x=>x!=null);
  return [];
}

// snapToArray: بيحول Firebase snapshot لـ array وبيضيف _key لكل عنصر
function snapToArray(snap){
  if(!snap.exists()) return [];
  const val = snap.val();
  if(Array.isArray(val)){
    return val.filter(x=>x!=null).map((x,i)=>{
      if(typeof x !== "object") return null;
      // لو فيه videos — نحولها لـ array
      if(x.videos) x = {...x, videos: fixArr(x.videos)};
      if(x.questions) x = {...x, questions: fixArr(x.questions)};
      return {...x, _key: String(i)};
    }).filter(Boolean);
  }
  return Object.entries(val).map(([k,v])=>{
    if(typeof v !== "object" || v === null) return null;
    // لو فيه videos أو questions — نحولها لـ array صح
    if(v.videos)    v = {...v, videos:    fixArr(v.videos)};
    if(v.questions) v = {...v, questions: fixArr(v.questions)};
    if(v.options)   v = {...v, options:   fixArr(v.options)};
    return {...v, _key: k};
  }).filter(Boolean);
}

// ================================================================
// STATE HELPERS
// ================================================================
function isEnrolled(cid){return S.enrolledCourses[cid]===true;}
function isUnlocked(sid){return S.unlockedSessions[sid]===true;}
function isPending(sid){return S.pendingSessions[sid]===true;}
function isFree(sid){var s=SESSIONS.find(x=>x._key===sid||x.id===sid);return s&&s.price===0;}
function canWatch(sid){return CU&&(CU.role==="admin"||isFree(sid)||isUnlocked(sid));}
function pendingCnt(){return REQUESTS.filter(r=>r.status==="pending").length;}
function unreadCnt(){return NOTIFS.filter(n=>!n.read&&(n.targetUid===CU?.uid||n.targetRole==="all")).length;}
function hwPendingCnt(){return HW_SUBMISSIONS.filter(s=>s.grade===null||s.grade===undefined).length;}

function updateDot(){
  var dot=document.getElementById("ndot");if(!dot)return;
  var cnt=CU&&CU.role==="admin"?(pendingCnt()+hwPendingCnt()):unreadCnt();
  dot.style.display=cnt>0?"block":"none";
}

async function saveUserState(){
  if(!CU) return;
  await dbSet("user_state/"+CU.uid,{
    enrolledCourses:S.enrolledCourses,
    unlockedSessions:S.unlockedSessions,
    pendingSessions:S.pendingSessions,
  });

async function doLogin(){
  var em=document.getElementById("f-em")?.value.trim()||"";
  var pw=document.getElementById("f-pw")?.value||"";
  if(!em||!pw){showAuthErr("Please fill all fields");return;}
  var btn=document.getElementById("btn-login");
  if(btn){btn.disabled=true;btn.textContent="Logging in...";}
  try {
    await signInWithEmailAndPassword(auth,em,pw);
    // onAuthStateChanged handles the rest
  } catch(e){
    showAuthErr(firebaseErrMsg(e.code));
    if(btn){btn.disabled=false;btn.textContent="Login";}
  }
}
window.doLogin=doLogin;

async function doRegister(){
  var nm=document.getElementById("f-nm")?.value.trim()||"";
  var em=document.getElementById("f-em")?.value.trim()||"";
  var ph=document.getElementById("f-ph")?.value.trim()||"";
  var pw=document.getElementById("f-pw")?.value||"";
  if(!nm||!em||!pw){showAuthErr("Please fill all fields");return;}
  if(pw.length<6){showAuthErr("Password must be at least 6 characters");return;}
  var btn=document.getElementById("btn-reg");
  if(btn){btn.disabled=true;btn.textContent="Creating account...";}
  try {
    const cred = await createUserWithEmailAndPassword(auth,em,pw);
    const uid = cred.user.uid;
    await dbSet("users/"+uid,{
      uid, name:nm, email:em, phone:ph,
      role:"student", av:nm.charAt(0).toUpperCase(),
      active:true, joined:new Date().toISOString().slice(0,10)
    });
    // onAuthStateChanged handles startMain
  } catch(e){
    showAuthErr(firebaseErrMsg(e.code));
    if(btn){btn.disabled=false;btn.textContent="Create Account";}
  }
}
window.doRegister=doRegister;

async function logout(){
  await signOut(auth);
  CU=null;
  S.activeCourse=null; S.page="landing";
  S.enrolledCourses={}; S.unlockedSessions={}; S.pendingSessions={};
  document.getElementById("pg-auth").style.display="flex";
  document.getElementById("pg-main").style.display="none";
}
window.logout=logout;

function firebaseErrMsg(code){
  var map={
    "auth/user-not-found":"Email not found",
    "auth/wrong-password":"Incorrect password",
    "auth/email-already-in-use":"Email already registered",
    "auth/invalid-email":"Invalid email address",
    "auth/weak-password":"Password is too weak",
    "auth/invalid-credential":"Incorrect email or password",
    "auth/too-many-requests":"Too many attempts. Try again later",
  };
  return map[code]||"An error occurred. Please try again";
}

// ================================================================
// onAuthStateChanged — app entry point
// ================================================================
onAuthStateChanged(auth, async (firebaseUser) => {
  if(firebaseUser){
    console.log("🔐 Auth user:", firebaseUser.uid, firebaseUser.email);
    // Load user profile from DB
    const snap = await dbGet("users/"+firebaseUser.uid);
    if(!snap.exists()){
      console.warn("⚠️ User not in DB, creating...");
      await dbSet("users/"+firebaseUser.uid,{
        uid:firebaseUser.uid, name:firebaseUser.email.split("@")[0],
        email:firebaseUser.email, role:"student", av:"U", active:true,
        joined:new Date().toISOString().slice(0,10)
      });
      const snap2 = await dbGet("users/"+firebaseUser.uid);
      CU = {...snap2.val(), uid:firebaseUser.uid};
    } else {
      CU = {...snap.val(), uid:firebaseUser.uid};
    }
    console.log("👤 Current user:", CU.name, CU.role);

    if(CU.active===false){
      await signOut(auth);
      document.getElementById("pg-loading").style.display="none";
      document.getElementById("pg-auth").style.display="flex";
      switchTab("login");
      showAuthErr("Your account has been suspended. Contact admin.");
      return;
    }

    await loadAllData();
    startMain();
  } else {
    document.getElementById("pg-loading").style.display="none";
    document.getElementById("pg-auth").style.display="flex";
    switchTab("login");
  }
});

function startMain(){
  document.getElementById("pg-loading").style.display="none";
  document.getElementById("pg-auth").style.display="none";
  document.getElementById("pg-main").style.display="block";
  S.page = CU.role==="admin" ? "dashboard" : "landing";
  updateDot(); renderSidebar(); renderPage();
  toast("Welcome, "+CU.name.split(" ")[0]+"! 👋","success");
}

function readFile(input,maxMB,onDone){
  var file=input.files[0];if(!file)return;

function courseCard(c,adminMode){
  var ck=getKey(c);
  var ss=SESSIONS.filter(s=>s.cid===ck||s.cid===c.id);
  var freeCnt=ss.filter(s=>s.price===0).length;
  var paidPrices=ss.filter(s=>s.price>0).map(s=>s.price);
  var minPrice=paidPrices.length?Math.min(...paidPrices):0;
  var bg=gradeColor(c.gradeId); var em=gradeEm(c.gradeId);
  var enrolled=isEnrolled(ck)||isEnrolled(c.id);
  var totalVideos=ss.reduce((a,s)=>a+(s.videos?s.videos.length:0),0);
  var h=`<div class="cc" onclick="openCourse('${ck}')">`;
  h+=`<div class="cth" style="background:${bg}">`;
  if(c.img)h+=`<img src="${c.img}" style="width:100%;height:100%;object-fit:cover">`;
  else h+=`<div class="cth-em">${em}</div>`;
  h+=`<span class="ctag-gr">${gradeName(c.gradeId)}</span>`;
  if(enrolled&&!adminMode)h+=`<span class="ctag-enrolled">✅ Enrolled</span>`;
  h+=`</div><div class="cbody">`;
  h+=`<div class="cc-grade">${gradeName(c.gradeId)}</div>`;
  h+=`<div class="cc-title">${c.title}</div>`;
  h+=`<div class="cc-meta"><span>🎬 ${ss.length} sessions</span><span>▶️ ${totalVideos} videos</span><span>🆓 ${freeCnt} free</span></div>`;
  if(!adminMode){
    if(!enrolled)h+=`<div class="pill pill-gn" style="margin-bottom:.55rem">✅ Free Enrollment</div>`;
    if(paidPrices.length)h+=`<div class="pill pill-or" style="margin-bottom:.55rem">From ${minPrice} EGP / session</div>`;
  }
  if(adminMode){
    h+=`<div style="margin-bottom:.55rem">${bd(c.pub?"bd-gr":"bd-gy",c.pub?"Published":"Draft")}</div>`;
    h+=`<div style="display:flex;gap:.35rem"><button class="btn btn-sm btn-se" style="flex:1" onclick="event.stopPropagation();openEditCourse('${ck}')">✏️ Edit</button><button class="btn btn-sm btn-re" onclick="event.stopPropagation();delCourse('${ck}')">🗑</button></div>`;
  } else if(enrolled){
    h+=`<button class="btn btn-pr btn-block" onclick="event.stopPropagation();openCourse('${ck}')">View Sessions →</button>`;
  } else {
    h+=`<button class="btn btn-gn btn-block" onclick="event.stopPropagation();enrollCourse('${ck}')">✅ Enroll Free</button>`;
  }
  h+=`</div></div>`;
  return h;
}

async function enrollCourse(cid){
  if(isEnrolled(cid)){toast("Already enrolled","error");return;}
  S.enrolledCourses[cid]=true;
  await saveUserState();
  var c=COURSES.find(x=>getKey(x)===cid);
  toast("✅ Enrolled in "+(c?c.title:"course")+" — Free!","success");
  renderPage();
}

      h+=`<div style="display:flex;gap:.5rem;align-items:center">

async function gradeHW(sk){
  var sub=HW_SUBMISSIONS.find(s=>getKey(s)===sk);if(!sub)return;

async function saveExam(){
  var title=document.getElementById("m-xt")?.value.trim()||"";
  if(!title){toast("Enter exam title","error");return;}
  var sessId=document.getElementById("m-xs")?.value||null;
  var qs=[];
  document.querySelectorAll("#exam-qs-cont > div").forEach((div,i)=>{
    var qEl=div.querySelector("[id$='-q']");var qText=qEl?.value.trim()||"";if(!qText)return;
    var ptsEl=div.querySelector("[id$='-pts']");var pts=parseInt(ptsEl?.value||2)||2;
    var cEl=div.querySelector("[id$='-c']");
    if(cEl){
      var opts={};
      for(var j=0;j<4;j++){var o=div.querySelector(`[id$='-o${j}']`);opts[j]=o?.value.trim()||"Option "+(j+1);}
      qs.push({id:i+1,type:"mcq",text:qText,options:opts,correct:parseInt(cEl.value)||0,pts});
    } else {qs.push({id:i+1,type:"essay",text:qText,pts});}
  });
  if(!qs.length){toast("Add at least one question","error");return;}
  // نحفظ questions كـ object بدل array
  var qsObj={};qs.forEach((q,i)=>{qsObj[i]=q;});
  var obj={title,sessionId:sessId||null,questions:qsObj,createdAt:Date.now()};
  var newRef=push(dbRef("exams"));
  await set(newRef,obj);
  var ek=newRef.key;
  EXAMS.push({...obj,_key:ek});
  if(sessId){
    var sess=SESSIONS.find(s=>getKey(s)===sessId);
    if(sess){sess.examId=ek;await dbUpdate("sessions/"+sessId,{examId:ek});}
  }
  toast("✅ Exam created","success");closeM();renderPage();
}
window.saveExam=saveExam;
async function delExam(ek){
  if(!confirm("Delete exam?"))return;
  await dbRemove("exams/"+ek);
  SESSIONS.forEach(async s=>{if(s.examId===ek){s.examId=null;await dbUpdate("sessions/"+getKey(s),{examId:null});}});
  EXAMS.splice(EXAMS.findIndex(e=>getKey(e)===ek),1);
  toast("Deleted","success");renderPage();
}
window.delExam=delExam;
function openGradeEssay(ek,userId){
  var exam=EXAMS.find(e=>getKey(e)===ek);

    var cur=sub.essayGrades?.[q.id]!==undefined?sub.essayGrades[q.id]:"";
    h+=`<div class="exam-q"><div class="exam-q-num">Essay • ${q.pts} pts</div>
    <div class="exam-q-text">${q.text}</div>

async function saveEssays(ek,userId){
  var exam=EXAMS.find(e=>getKey(e)===ek);
  var sub=EXAM_SUBMISSIONS.find(s=>s.examId===ek&&s.userId===userId);
  if(!exam||!sub)return;
  if(!sub.essayGrades)sub.essayGrades={};
  exam.questions.filter(q=>q.type==="essay").forEach(q=>{
    var inp=document.getElementById("eg-"+q.id);
    if(inp){var v=parseInt(inp.value);if(!isNaN(v)&&v>=0&&v<=q.pts)sub.essayGrades[q.id]=v;}
  });
  var sk=getKey(sub);
  await dbUpdate("exam_submissions/"+sk,{essayGrades:sub.essayGrades});
  toast("✅ Saved","success");updateDot();closeM();renderPage();
}

    :bd(r.status==="approved"?"bd-gr":"bd-re",r.status==="approved"?"✅ Approved":"❌ Rejected")}

async function approveReq(rk){
  var r=REQUESTS.find(x=>getKey(x)===rk);if(!r)return;
  r.status="approved";
  await dbUpdate("requests/"+rk,{status:"approved"});
  // Unlock session for that user
  var stateRef="user_state/"+r.userId+"/unlockedSessions/"+r.sessionId;
  await dbSet(stateRef,true);
  var pendRef="user_state/"+r.userId+"/pendingSessions/"+r.sessionId;
  await dbRemove(pendRef);
  // If it's current user update local state
  if(CU.uid===r.userId){S.unlockedSessions[r.sessionId]=true;delete S.pendingSessions[r.sessionId];}
  await pushNotif(r.userId,"✅","Session Unlocked","'"+r.sessionName+"' is now unlocked!");
  toast("✅ Approved — session unlocked","success");updateDot();renderSidebar();renderPage();
}
window.approveReq=approveReq;
async function rejectReq(rk){
  var r=REQUESTS.find(x=>getKey(x)===rk);if(!r)return;
  r.status="rejected";
  await dbUpdate("requests/"+rk,{status:"rejected"});
  var pendRef="user_state/"+r.userId+"/pendingSessions/"+r.sessionId;
  await dbRemove(pendRef);
  if(CU.uid===r.userId)delete S.pendingSessions[r.sessionId];
  await pushNotif(r.userId,"❌","Request Rejected","Payment request for '"+r.sessionName+"' was rejected.");
  toast("Rejected","error");updateDot();renderSidebar();renderPage();
}

async function submitHW(sk,input){
  readFile(input,10,async function(data,name){
    var now=new Date().toLocaleString();
    var sess=SESSIONS.find(s=>getKey(s)===sk);
    var existing=HW_SUBMISSIONS.find(x=>x.sessionId===sk&&x.userId===CU.uid);
    var obj={sessionId:sk,userId:CU.uid,userName:CU.name,fileName:name,fileData:data,submittedAt:now,grade:null,feedback:""};
    if(existing){
      var ek=getKey(existing);
      Object.assign(existing,obj);
      await dbUpdate("hw_submissions/"+ek,obj);
    } else {
      var newRef=push(dbRef("hw_submissions"));

      HW_SUBMISSIONS.push({...obj,_key:newRef.key});
    }

async function sendReq(sk,cid){
  var s=SESSIONS.find(x=>getKey(x)===sk);
  var c=COURSES.find(x=>getKey(x)===cid);
  if(!s||!c)return;

  S.pendingSessions[sk]=true;

  var now=new Date();
  var ds=now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate()+" "+now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
  var obj={userId:CU.uid,sessionId:sk,courseId:cid,userName:CU.name,phone,sessionName:s.title,grade:gradeName(c.gradeId),amount:String(s.price),date:ds,status:"pending"};
  var newRef=push(dbRef("requests"));
  await set(newRef,obj);
  REQUESTS.push({...obj,_key:newRef.key});
  await pushNotif("admin","💰","New Payment Request",CU.name+" → "+s.title+" ("+s.price+" EGP)");
  updateDot();closeM();toast("✅ Request sent! Waiting for approval","success");renderSidebar();renderPage();
}
window.sendReq=sendReq;

// ================================================================
// EXAM TAKING
// ================================================================
window.startExam=function(ek){S.activeExamId=ek;S.examAnswers={};S.page="take-exam";renderPage();};
function renderTakeExam(){
  var exam=EXAMS.find(e=>getKey(e)===S.activeExamId);
  if(!exam)return`<div class="es"><div class="es-ic">❌</div><h3>Exam not found</h3></div>`;
  var totalPts=exam.questions?.reduce((a,q)=>a+q.pts,0)||0;
  var h=`<div class="bk" onclick="S.page='myexams';S.activeExamId=null;renderPage()">← Back</div>
  <div style="background:var(--grad);border-radius:var(--r2);padding:1.25rem;color:#fff;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem">
  <div><div style="font-size:17px;font-weight:800">${exam.title}</div><div style="font-size:12.5px;opacity:.85">${exam.questions?.length||0} questions • ${totalPts} pts</div></div>
  <span class="pill" style="background:rgba(255,255,255,.2);color:#fff">⏳ In Progress</span></div>`;
  exam.questions?.forEach((q,i)=>{
    h+=`<div class="exam-q" id="q-${q.id}">
    <div class="exam-q-num">Q${i+1} / ${exam.questions.length} — ${q.type==="mcq"?"MCQ":"Essay"} • ${q.pts} pts</div>
    <div class="exam-q-text">${q.text}</div>`;
    if(q.type==="mcq"){
      q.options?.forEach((opt,oi)=>{
        var sel=S.examAnswers[q.id]===oi;
        h+=`<div class="mcq-opt${sel?" selected":""}" onclick="selectMCQ(${q.id},${oi})">
        <div class="mcq-circle">${sel?"✓":""}</div><span>${opt}</span></div>`;
      });
    } else {
      h+=`<textarea class="essay-ta" placeholder="Write your answer here..." oninput="S.examAnswers[${q.id}]=this.value">${S.examAnswers[q.id]||""}</textarea>`;
    }
    h+=`</div>`;
  });
  h+=`<div style="display:flex;justify-content:flex-end;margin-top:1rem"><button class="btn btn-gn btn-lg" onclick="submitExam()">✅ Submit Exam</button></div>`;
  return h;
}
window.selectMCQ=function(qId,oi){S.examAnswers[qId]=oi;renderPage();};
async function submitExam(){
  var exam=EXAMS.find(e=>getKey(e)===S.activeExamId);if(!exam)return;
  var unanswered=exam.questions?.filter(q=>S.examAnswers[q.id]===undefined).length||0;
  if(unanswered>0&&!confirm(unanswered+" unanswered. Submit anyway?"))return;
  var mcqScore=0;var essayGrades={};
  exam.questions?.forEach(q=>{
    if(q.type==="mcq"){if(S.examAnswers[q.id]===q.correct)mcqScore+=q.pts;}
    else{essayGrades[q.id]=null;}
  });
  var ek=getKey(exam);
  var obj={examId:ek,userId:CU.uid,userName:CU.name,answers:{...S.examAnswers},mcqScore,essayGrades,submittedAt:new Date().toLocaleString()};
  var newRef=push(dbRef("exam_submissions"));
  await set(newRef,obj);
  EXAM_SUBMISSIONS.push({...obj,_key:newRef.key});
  await pushNotif("admin","📝","Exam Submitted",CU.name+" submitted: "+exam.title);
  toast("✅ Exam submitted!","success");viewExamResult(ek);
}
window.submitExam=submitExam;
function viewExamResult(ek){
  var exam=EXAMS.find(e=>getKey(e)===ek);
  var sub=EXAM_SUBMISSIONS.find(s=>s.examId===ek&&s.userId===CU.uid);
  if(!exam||!sub){toast("Result not available","warn");return;}
  var totalPts=exam.questions?.reduce((a,q)=>a+q.pts,0)||0;
  var mcqPts=exam.questions?.filter(q=>q.type==="mcq").reduce((a,q)=>a+q.pts,0)||0;
  var essayPts=exam.questions?.filter(q=>q.type==="essay").reduce((a,q)=>a+q.pts,0)||0;
  var eg=sub.essayGrades?Object.values(sub.essayGrades).reduce((a,v)=>a+(v||0),0):0;
  var ed=essayPts===0||(sub.essayGrades&&!Object.values(sub.essayGrades).some(v=>v===null));
  var total=ed?sub.mcqScore+eg:null;
  var pct=total!==null?Math.round(total/totalPts*100):Math.round(sub.mcqScore/Math.max(mcqPts,1)*100);
  document.getElementById("mtitle").textContent="Exam Results";
  document.getElementById("mbox").className="mbox mbox-lg";
  var h=`<div class="exam-score">
  <div class="exam-score-num">${total!==null?total:sub.mcqScore}${total===null?"+?":""}</div>
  <div class="exam-score-lbl">out of ${totalPts} points</div>
  <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
  <div style="display:flex;justify-content:center;gap:1.5rem;font-size:12.5px;opacity:.85">
  <span>MCQ: ${sub.mcqScore}/${mcqPts}</span>
  ${essayPts>0?`<span>Essay: ${ed?eg:" Awaiting"}/${essayPts}</span>`:""}
  </div></div>`;
  exam.questions?.forEach((q,i)=>{
    var ans=sub.answers?.[q.id];
    h+=`<div class="exam-q"><div class="exam-q-num">Q${i+1} — ${q.type==="mcq"?"MCQ":"Essay"} • ${q.pts} pts</div>
    <div class="exam-q-text">${q.text}</div>`;
    if(q.type==="mcq"){
      q.options?.forEach((opt,oi)=>{
        var isCorr=oi===q.correct,wasSel=ans===oi;
        var cls="mcq-opt"+(isCorr?" correct":wasSel?" wrong":"");
        h+=`<div class="${cls}"><div class="mcq-circle">${isCorr?"✓":wasSel?"✗":""}</div><span>${opt}</span>
        ${isCorr?`<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--ac)">Correct ✅</span>`:""}
        </div>`;
      });
    } else {
      var eg2=sub.essayGrades?.[q.id]!==undefined?sub.essayGrades[q.id]:null;
      h+=`<div style="font-size:11.5px;font-weight:700;color:var(--tx2);margin-bottom:.35rem">Your Answer:</div>
      <textarea class="essay-ta" readonly>${sub.answers?.[q.id]||"(no answer)"}</textarea>
      <div style="font-size:12px;font-weight:700;color:${eg2!==null?"var(--ac)":"var(--or)"};margin-top:.5rem">
      ${eg2!==null?"Score: "+eg2+"/"+q.pts:"⏳ Awaiting teacher grading"}</div>`;
    }
    h+=`</div>`;
  });
  document.getElementById("mbody").innerHTML=h;
  document.getElementById("mfoot").innerHTML=`<button class="btn btn-pr" onclick="closeM()">Close</button>`;
  document.getElementById("mov").classList.add("show");
}
window.viewExamResult=viewExamResult;

// ================================================================
// MODAL
// ================================================================
window.closeM=function(){document.getElementById("mov").classList.remove("show");};
window.closeMov=function(e){if(e.target===document.getElementById("mov"))closeM();};

</script>
